# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# OIDC providers and applications for the Nexus web interface and the Android app.
# Client ID, client secret and hostname come from the environment (see .env.example),
# so no deployment-specific value lives in this public repository.
version: 1
metadata:
  name: Nexus - OIDC provider
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Nexus - WebAuthn policy
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Nexus
    attrs:
      client_type: confidential
      client_id: !Env NEXUS_OIDC_CLIENT_ID
      client_secret: !Env NEXUS_OIDC_CLIENT_SECRET
      authentication_flow: !Find [authentik_flows.flow, [slug, nexus-authentication-passkey]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/accounts/oidc/authentik/login/callback/", !Env NEXUS_HOST]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    identifiers:
      slug: nexus
    attrs:
      name: Nexus
      provider: !KeyOf provider
      meta_launch_url: !Format ["https://%s/", !Env NEXUS_HOST]
      policy_engine_mode: any

  # The Android app is a public client: it cannot keep a secret, so it proves itself
  # with PKCE instead, and returns from the system browser through its own URL scheme.
  - model: authentik_providers_oauth2.oauth2provider
    id: mobile-provider
    identifiers:
      name: Nexus Android
    attrs:
      client_type: public
      client_id: !Env NEXUS_OIDC_MOBILE_CLIENT_ID
      authentication_flow: !Find [authentik_flows.flow, [slug, nexus-authentication-passkey]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: fi.agx.nexus://oauth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_token_validity: minutes=10
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]

  - model: authentik_core.application
    identifiers:
      slug: nexus-android
    attrs:
      name: Nexus Android
      provider: !KeyOf mobile-provider
      policy_engine_mode: any
