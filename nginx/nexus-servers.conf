# Nexus, a personal intranet
# https://github.com/AgenttiX/nexus
#
# The upstream addresses are the ports published by Docker Compose (BIND_ADDRESS in .env).
# Change 127.0.0.1 to the address of the Docker host when Nginx runs on another machine.

upstream nexus_web {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream nexus_mcp {
    server 127.0.0.1:8001 fail_timeout=0;
}

upstream nexus_authentik {
    server 127.0.0.1:9000;
    keepalive 10;
}

server {
    server_name nexus.agx.fi;
    include /etc/nginx/conf.d/servers/nexus-settings.conf;

    # MCP server for AI agents (Streamable HTTP, bearer token authentication)
    location /mcp {
        include /etc/nginx/conf.d/misc/gunicorn_proxy.conf;
        proxy_cache off;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_pass http://nexus_mcp;
    }

    # Django: API, admin, login and the web interface
    location / {
        include /etc/nginx/conf.d/misc/gunicorn_proxy.conf;
        proxy_pass http://nexus_web;
    }
}

server {
    server_name auth.agx.fi;
    include /etc/nginx/conf.d/servers/nexus-settings.conf;

    # https://docs.goauthentik.io/install-config/reverse-proxy/
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://nexus_authentik;
    }
}
