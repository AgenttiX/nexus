# Development services only: run Django and Vite on the host.
#   docker compose -f compose.dev.yaml up -d
name: nexus-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  db:
