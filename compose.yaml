# Nexus production stack. TLS is terminated by an external Nginx (see nginx/).
name: nexus

x-backend: &backend
  image: ${NEXUS_IMAGE:-ghcr.io/agenttix/nexus:latest}
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
    DJANGO_SECRET_KEY_FALLBACKS: ${DJANGO_SECRET_KEY_FALLBACKS:-}
    FIELD_ENCRYPTION_SALT: ${FIELD_ENCRYPTION_SALT:?}
    DJANGO_ALLOWED_HOSTS: ${NEXUS_HOST:?}
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${NEXUS_HOST}
    TIME_ZONE: ${TIME_ZONE:-UTC}
    LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
    LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
    NEWS_PARALLEL_SESSIONS: ${NEWS_PARALLEL_SESSIONS:-4}
    COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
    OIDC_SERVER_URL: https://${AUTHENTIK_HOST:?}/application/o/nexus/
  networks:
    - internal
    - egress
  labels:
    wud.watch: "true"

x-hardened: &hardened
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *backend
    restart: on-failure
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    healthcheck:
      # The Host header must be an allowed host, or Django answers 400.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["DJANGO_ALLOWED_HOSTS"].split(",")[0]
          request = urllib.request.Request("http://127.0.0.1:8000/api/health/", headers={"Host": host})
          urllib.request.urlopen(request, timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3

  # MCP server for AI agents. Reached through Nginx at https://<NEXUS_HOST>/mcp
  mcp:
    <<: *backend
    command: ["uvicorn", "nexus.mcp_asgi:application", "--host", "0.0.0.0", "--port", "8001", "--no-server-header"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8001}:8001"

  worker:
    <<: *backend
    command: ["celery", "--app", "nexus", "worker", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ${AW_SYNC_DIR:-./data/activitywatch}:/data/activitywatch:ro

  beat:
    <<: *backend
    command: ["celery", "--app", "nexus", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    <<: *hardened
    image: postgres:18-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username nexus --dbname nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *hardened
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    user: "999:1000"
    read_only: true
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  authentik-server: &authentik
    <<: *hardened
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.5}
    command: ["server"]
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      # Read by the blueprints in authentik/blueprints/
      NEXUS_HOST: ${NEXUS_HOST:?}
      NEXUS_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      NEXUS_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
    volumes:
      - authentik-data:/data
      - ./authentik/blueprints:/blueprints/nexus:ro
    depends_on:
      authentik-db:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AUTHENTIK_PORT:-9000}:9000"
    networks:
      - authentik
      - egress

  authentik-worker:
    <<: *authentik
    command: ["worker"]
    ports: []
    depends_on:
      authentik-server:
        condition: service_healthy

  authentik-db:
    <<: *hardened
    image: postgres:18-alpine
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?}
    volumes:
      - authentik-db:/var/lib/postgresql
    networks:
      - authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username authentik --dbname authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: notifies about (or applies) new image versions. Start with `--profile wud`.
  wud:
    image: getwud/wud:9.8.0
    profiles: [wud]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3080:3000"

networks:
  # Databases and Redis are reachable only from here; no route to the outside.
  internal:
    internal: true
  authentik:
    internal: true
  # Outbound access for fetching news, prices and menus, and for published ports.
  egress:

volumes:
  db:
  authentik-db:
  authentik-data:
