name: Android app

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the APK to the release
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Keep the debug APK for trying the change on a device
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: nexus-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # The signing key lives only in repository secrets, never in the repository.
      - name: Build signed release APK
        if: github.event_name == 'push'
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Android installs an update only when its version code is higher than the installed one.
          ./gradlew assembleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"

      - name: Attach APK to the release
        if: github.event_name == 'push'
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "nexus-$TAG.apk"
          gh release create "$TAG" --generate-notes || true
          gh release upload "$TAG" "nexus-$TAG.apk" --clobber
